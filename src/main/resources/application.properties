spring.application.name=onlineshop

# Keep internal exception details out of API error responses.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# MySQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/online_shopping_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:19952803}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Redis Configuration
app.redis.enabled=${APP_REDIS_ENABLED:false}
spring.cache.type=${SPRING_CACHE_TYPE:none}
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
app.cache.fallback.max-entries=${APP_CACHE_FALLBACK_MAX_ENTRIES:1000}
app.cache.fallback.ttl-minutes=${APP_CACHE_FALLBACK_TTL_MINUTES:10}

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Version new schema changes while baselining the existing draft schema.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Email Notification Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-email-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# API doc Configuration
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui
springdoc.api-docs.path=/v3/api-docs

# Public operational health check; keep all other actuator endpoints closed.
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,metrics
management.endpoint.metrics.access=read_only
management.endpoint.health.show-details=never

# Logging Configuration
logging.level.org.springframework.web=DEBUG~
logging.level.org.springframework.security=DEBUG
#logging.level.org.hibernate.SQL=DEBUG
logging.level.com.example.onlineshop=DEBUG
server.tomcat.access-log-enabled=true
server.tomcat.access-log-pattern=%h %l %u %t "%r" %s %b

# Authentication Configuration
secret.key=GcOWiv2/ZG3Xp0FqBbgCQBL0f3Z1wW4FhdGE+BlCjhs=

# Standard local data seed. Override passwords with environment-specific values.
app.seed.enabled=${APP_SEED_ENABLED:false}
app.seed.admin-password=${SEED_ADMIN_PASSWORD:Admin123!}
app.seed.manager-password=${SEED_MANAGER_PASSWORD:Manager123!}
app.seed.buyer-password=${SEED_BUYER_PASSWORD:Buyer123!}

# Kafka Configuration
app.kafka.enabled=${APP_KAFKA_ENABLED:false}
app.payments.mock.enabled=${APP_MOCK_PAYMENTS_ENABLED:true}
app.payments.mock.token=${APP_MOCK_PAYMENTS_TOKEN:local-mock-payment-token}
app.payments.mock.webhook-secret=${APP_MOCK_WEBHOOK_SECRET:local-mock-webhook-secret}
app.payments.reconciliation.fixed-delay-ms=${APP_PAYMENTS_RECONCILIATION_FIXED_DELAY_MS:300000}
app.orders.expiry.fixed-delay-ms=${APP_ORDERS_EXPIRY_FIXED_DELAY_MS:60000}
app.outbox.fixed-delay-ms=${APP_OUTBOX_FIXED_DELAY_MS:10000}
app.notifications.fixed-delay-ms=${APP_NOTIFICATIONS_FIXED_DELAY_MS:15000}
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=application-consumer-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.onlineshop.dto
spring.kafka.listener.ack-mode=record
spring.kafka.listener.missing-topics-fatal=false
